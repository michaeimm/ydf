name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Analyze, test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/ydf-windows-x64.zip

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: ydf-windows-x64
          path: dist/ydf-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Analyze, test and build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build Linux release
        run: flutter build linux --release --no-pub

      - name: Package Linux release
        run: |
          mkdir -p dist
          tar -czf dist/ydf-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux release
        uses: actions/upload-artifact@v7
        with:
          name: ydf-linux-x64
          path: dist/ydf-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: ydf-*-x64
          path: dist
          merge-multiple: true

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/ydf-windows-x64.zip \
            dist/ydf-linux-x64.tar.gz \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
